<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Engine-Aware Manager Architecture">
  <rect width="860" height="320" fill="#f8fafc" rx="12" />
  <style>
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    .accent { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
    .title { font: 600 13px system-ui, sans-serif; fill: #0f172a; }
    .sub { font: 400 11px system-ui, sans-serif; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="24" y="32" width="180" height="64" class="accent" />
  <text x="114" y="58" text-anchor="middle" class="title">Target Selection</text>
  <text x="114" y="76" text-anchor="middle" class="sub">nodeId + profileRevision</text>

  <rect x="240" y="32" width="200" height="64" class="box" />
  <text x="340" y="58" text-anchor="middle" class="title">Discovery &amp; Profile</text>
  <text x="340" y="76" text-anchor="middle" class="sub">eKuiper / reKuiper / Mode</text>

  <rect x="480" y="32" width="170" height="64" class="box" />
  <text x="565" y="58" text-anchor="middle" class="title">UI &amp; Catalogs</text>
  <text x="565" y="76" text-anchor="middle" class="sub">Sidebar, SQL, Recipes</text>

  <rect x="680" y="32" width="156" height="64" class="box" />
  <text x="758" y="58" text-anchor="middle" class="title">Flow Compilers</text>
  <text x="758" y="76" text-anchor="middle" class="sub">eKuiper | reKuiper</text>

  <rect x="240" y="136" width="240" height="68" class="accent" />
  <text x="360" y="162" text-anchor="middle" class="title">Node-Bound Engine API</text>
  <text x="360" y="180" text-anchor="middle" class="sub">/api/nodes/[id]/engine + Policy</text>

  <rect x="530" y="136" width="306" height="68" class="box" />
  <text x="683" y="162" text-anchor="middle" class="title">SSE Streaming Relay</text>
  <text x="683" y="180" text-anchor="middle" class="sub">/comms WS -> SSE &amp; /test/[name]</text>

  <rect x="140" y="236" width="210" height="58" class="box" />
  <text x="245" y="262" text-anchor="middle" class="title">eKuiper 2.4.1 / 2.4.2 / 2.5</text>
  <text x="245" y="278" text-anchor="middle" class="sub">Registered REST endpoint</text>

  <rect x="400" y="236" width="230" height="58" class="box" />
  <text x="515" y="262" text-anchor="middle" class="title">reKuiper main (24848c8)</text>
  <text x="515" y="278" text-anchor="middle" class="sub">REST + /comms + Declarative</text>

  <rect x="666" y="236" width="170" height="58" class="box" />
  <text x="751" y="262" text-anchor="middle" class="title">Fleet Devices</text>
  <text x="751" y="278" text-anchor="middle" class="sub">Hub + deviceId proxy</text>

  <line x1="204" y1="64" x2="240" y2="64" class="arrow" />
  <line x1="440" y1="64" x2="480" y2="64" class="arrow" />
  <line x1="650" y1="64" x2="680" y2="64" class="arrow" />
  <line x1="340" y1="96" x2="340" y2="136" class="arrow" />
  <line x1="480" y1="170" x2="530" y2="170" class="arrow" />
  <line x1="310" y1="204" x2="255" y2="236" class="arrow" />
  <line x1="410" y1="204" x2="495" y2="236" class="arrow" />
  <line x1="660" y1="204" x2="545" y2="236" class="arrow" />
  <line x1="630" y1="265" x2="666" y2="265" class="arrow" />
</svg>

