name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-checks:
    name: Release Gate Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run quality, i18n, OpenAPI, and unit test gates
        run: |
          npm run check:i18n
          npm run lint
          npm run type-check
          npm run validate:openapi -- --skip-official
          npm test

      - name: Validate Docker Compose configuration
        run: docker compose -f compose.yaml config >/dev/null

  docker-release:
    name: Build & Publish Docker Image
    needs: gate-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        run: |
          DOCKER_REPO="indusstack/ekuipermanager"
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION_TAG="${RAW_TAG#v}"
          echo "tags=${DOCKER_REPO}:${VERSION_TAG},${DOCKER_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: indusstack/ekuipermanager
          readme-filepath: ./deploy/docker/README.md
          short-description: "Self-hosted web UI, Flow Studio, and operations manager for LF Edge eKuiper and reKuiper"

  publish-release:
    name: Publish GitHub Release
    needs: [gate-checks, docker-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "Release ${RAW_TAG}" > RELEASE_BODY.md
          fi
          cat <<EOF >> RELEASE_BODY.md

          ---
          ### Docker Image
          \`\`\`bash
          docker pull indusstack/ekuipermanager:${VERSION}
          docker pull indusstack/ekuipermanager:latest
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "eKuiper Manager ${{ inputs.tag || github.ref_name }}"
          body_path: RELEASE_BODY.md
          generate_release_notes: true

