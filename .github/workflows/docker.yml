name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      update_description_only:
        description: 'Only update Docker Hub description/README (skip build & tests)'
        type: boolean
        required: false
        default: false
      tag:
        description: 'Docker image tag (leave blank to infer from package.json)'
        type: string
        required: false
        default: ''
      skip_tests:
        description: 'Skip quality gates before building'
        type: boolean
        required: false
        default: false

jobs:
  update-description-only:
    name: Sync Docker Hub Description
    if: inputs.update_description_only == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: indusstack/ekuipermanager
          readme-filepath: ./deploy/docker/README.md
          short-description: "Self-hosted web UI, Flow Studio, and operations manager for LF Edge eKuiper and reKuiper"

  gate-checks:
    name: Docker Quality Gates & Tests
    if: inputs.update_description_only != true && inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality & Contract Checks
        run: |
          npm run check:i18n
          npm run lint
          npm run type-check
          npm run validate:openapi -- --skip-official
          npm test

      - name: Validate Docker Compose Configuration
        run: docker compose -f compose.yaml config >/dev/null

  build-and-push:
    name: Build & Push Docker Image
    needs: [gate-checks]
    if: |
      always() &&
      inputs.update_description_only != true &&
      (needs.gate-checks.result == 'success' || needs.gate-checks.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        run: |
          DOCKER_REPO="indusstack/ekuipermanager"
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_TAG="${{ inputs.tag }}"
            VERSION_TAG="${RAW_TAG#v}"
          else
            VERSION_TAG=$(node -p "require('./package.json').version")
          fi
          echo "tags=${DOCKER_REPO}:${VERSION_TAG},${DOCKER_REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: indusstack/ekuipermanager
          readme-filepath: ./deploy/docker/README.md
          short-description: "Self-hosted web UI, Flow Studio, and operations manager for LF Edge eKuiper and reKuiper"

